<style>

function C(k){
 if(memo[k])return memo[k];

 var g=function(key,cr){return f[key]!==undefined&&f[key]!==""?n(f[key]):(cr||0)};
 r.wo=g("wo",pc?pc.wc:0);r.wc=g("wc",r.wo);r.wl=r.wc-r.wo;r.ws=r.wl*p.wp;
 r.to=g("to",pc?pc.tl:0);r.rf=n(f.rf);r.tl=r.to+r.rf-r.wl;
 r.eo=g("eo",pc?pc.ec:0);r.ea=n(f.ea);r.ec=g("ec",r.eo+r.ea);r.esold=r.eo+r.ea-r.ec;r.cs=n(f.cs);r.sg=r.esold-r.cs*30;r.ca=r.cs*(p.cp!==undefined?p.cp:p.ep*30);r.sa=r.sg*p.ep;r.es=r.ca+r.sa;r.egchk=r.sg<0?"Crates sold are more than the eggs sold by stock count. Check the closing count.":"";
 
 var ipq=0,ps=0,ml=0,ms=0,mc=0,mm=0,pcs=0,pms=0,jp={},jps=0,wq=0,wv=0;

 r.wpos=wq;r.wpv=wv;if(wq>r.wl){r.wl=wq;r.ws=r.wl*p.wp;r.tl=r.to+r.rf-r.wl}r.ipq=ipq;r.ps=ps;r.jq={};r.js=jps;["j20","j10","j5","j1"].forEach(function(j){var m=n(f[j]);r.jq[j]=m+(jp[j]||0);r.js+=m*p[j]});r.ml=ml;r.ms=ms;r.mc=mc;r.mm=mm;r.pc=pcs;r.pm=pms;
 r.mclSet=f.mcl!==undefined&&f.mcl!=="";r.mcl=n(f.mcl);
 r.mo=g("mo",pc?(pc.mclSet?pc.mcl:pc.mrem):0);r.madd=d.a.reduce(function(a,b){return a+b},0);
 
 
 r.mrem=r.mo+r.madd-r.ml;
 var df=r.mcl-r.mrem;
 r.mchk=r.mclSet?("Counted "+fm(r.mcl)+" L, expected "+fm(r.mrem)+" L: "+(Math.abs(df)<0.01?"matches":(df<0?"short by ":"over by ")+fm(Math.abs(df))+" L")):"";
 r.ipcSet=f.ipc!==undefined&&f.ipc!=="";r.ipc=n(f.ipc);r.ipo=g("ipo",pc?(pc.ipcSet?pc.ipc:pc.ipr):0);r.ipa=n(f.ipa);r.ipr=r.ipo+r.ipa-r.ipq;
 r.ex=d.x.reduce(function(a,b){return a+b.a},0);
 r.tot=r.ws+r.es+r.js+r.ps+r.ms;r.till=n(f.till);r.cash=r.tot-r.till-r.pm;r.hand=r.cash-r.ex;
 return(memo[k]=r)
}
function active(){return Object.keys(S.days).sort().filter(function(k){var d=S.days[k];return d.s.length||d.x.length||d.a.length||Object.keys(d.f).some(function(x){return d.f[x]!==""})})}

 if(r.tl<=P.lw&&(r.to||r.rf||r.wl)){u=usage();a.push("LOW STOCK: Water (tank) "+fm(r.tl)+" L left"+(u?" (about "+fm(Math.max(0,r.tl)/u)+" days)":""))}

var views={};

+card("EGGS",R("Opening","eo","eo")+R("Eggs added today","ea")+R("Closing count","ec")+O("Eggs sold","esold")+R("Whole crates sold today","cs")+O("Single eggs sold","sg")+O("Egg sales","es")+'<div class="hint" data-o="egchk"></div>')

+card("MILK STOCK (litres)",R("Opening milk","mo","mo")+'<div class="add"><input id="ka" inputmode="decimal" placeholder="Litres added"><button class="pri" id="kb">Add milk</button></div><div id="kl"></div>'+O("Milk added today","madd")+O("REMAINING (auto)","mrem",1)+R("Closing count (litres left)","mcl")+'<div class="hint" data-o="mchk"></div>')

+card("TOTALS",O("TOTAL SALES","tot")+O("Cash taken on Sell","pc")+O("M-Pesa taken on Sell","pm")+R("M-Pesa till for water, eggs, jerricans","till")+O("Cash","cash")+O("Less expenses","ex")+O("CASH TO HAND OVER","hand",1))};
function refresh(){memo={};var r=C(cur);
 document.querySelectorAll("[data-o]").forEach(function(e){var o=e.dataset.o;e.textContent=(o==="mchk"||o==="egchk")?r[o]:fm(r[o]||0)});
 document.querySelectorAll("[data-c]").forEach(function(e){e.placeholder=fm(r[e.dataset.c]||0)});banner()}
function bindDay(){var d=day(cur);
 document.querySelectorAll("[data-f]").forEach(function(i){var v=d.f[i.dataset.f];i.value=v===undefined?"":v;i.oninput=function(){d.f[i.dataset.f]=i.value;save();refresh()}});

var cart=[],pay=null,NM={ml:"Milk 1 litre",mh:"Milk half litre",ip:"Ice pop",j20:"20L jerrican",j10:"10L jerrican",j5:"5L jerrican",j1:"1L plus water"},SZ={j20:20,j10:10,j5:5,j1:1};

+'<div class="sheet"><div id="lines"></div><p class="hint" id="hint">Tap an item to add it to this sale.</p><div class="pay" role="group" aria-label="Payment method"><button id="bCash" aria-pressed="false">Cash</button><button id="bMp" aria-pressed="false">M-Pesa</button><button id="bSplit" aria-pressed="false">Split</button></div><div class="row" id="splitRow" style="display:none"><label for="sm">M-Pesa part</label><input id="sm" type="number" inputmode="decimal" min="0" step="any" style="width:110px"><span id="sc" class="hint" style="flex:1;text-align:right"></span></div><div class="fin"><div class="total" id="total">KSh 0</div><button class="go" id="go" disabled>Complete sale</button></div></div>'};
function bindSell(){

 function grid(){var q=$("q").value.toLowerCase(),g=$("grid"),any=0;g.innerHTML="";ids.forEach(function(id){var jj=id.charAt(0)==="j";if(jj&&!q)return;if(q&&(NM[id]+(jj?" jerrican":"")).toLowerCase().indexOf(q)<0)return;any=1;var b=document.createElement("button");b.className="item";b.innerHTML="<b>"+NM[id]+"</b><span>KSh "+p[id]+"</span>";b.onclick=function(){var l=cart.find(function(c){return c.id===id});if(l)l.q=fm(l.q+1);else cart.push({id:id,q:1});cartUI()};g.appendChild(b)});$("none").style.display=any?"none":"block"}
